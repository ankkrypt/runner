name: 24-7 Mumbai VM Grabber
on:
  schedule:
    - cron: '*/30 * * * *' # Tries to start a new job every 30 minutes
  workflow_dispatch:

jobs:
  loop-request:
    runs-on: ubuntu-latest
    # This prevents multiple versions from running at the same time
    concurrency: 
      group: oci-grabber
      cancel-in-progress: true
    steps:
      - name: Install OCI CLI
        run: |
          pip install oci-cli
          echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          echo "region=ap-mumbai-1" >> ~/.oci/config
          echo "key_file=~/.oci/key.pem" >> ~/.oci/config
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem

      - name: Persistent Loop (25 minutes)
        run: |
          # This runs for 25 minutes, then exits cleanly so the next 'cron' can take over
          end=$((SECONDS+1500))
          while [ $SECONDS -lt $end ]; do
            echo "Attempting to launch at $(date)"
            
            # The '|| true' ensures that even if Oracle gives an error, the script doesn't stop
            oci resource-manager job create-apply-job \
              --stack-id ${{ secrets.OCI_STACK_OCID }} \
              --execution-plan-strategy AUTO_APPROVED || true
            
            echo "Waiting 30 seconds..."
            sleep 30
          done
