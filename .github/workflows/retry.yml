name: 24-7 Mumbai VM Grabber
on:
  schedule:
    - cron: '0 */5 * * *' # Restarts every 5 hours
  workflow_dispatch:      # Manual trigger

jobs:
  loop-request:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          # Fixed URL for the OCI CLI installer
          curl -L https://raw.githubusercontent.com -o install.sh
          chmod +x install.sh
          ./install.sh --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          echo "region=ap-mumbai-1" >> ~/.oci/config
          echo "key_file=~/.oci/key.pem" >> ~/.oci/config
          
          # Writing the private key secret to a file
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem

      - name: Infinite Loop (30s interval)
        run: |
          # This loop runs for 5 hours (18000 seconds)
          end=$((SECONDS+18000))
          while [ $SECONDS -lt $end ]; do
            echo "Attempting to launch at $(date)"
            
            # This triggers your Stack Apply Job and stores the result
            RESULT=$(oci resource-manager job create-apply-job \
              --stack-id ${{ secrets.OCI_STACK_OCID }} \
              --execution-plan-strategy AUTO_APPROVED 2>&1)
            
            echo "$RESULT"
            
            # Check if the job was successfully created (not necessarily the VM yet)
            if [[ "$RESULT" == *"lifecycle-state": "ACCEPTED"* ]] || [[ "$RESULT" == *"lifecycle-state": "IN_PROGRESS"* ]]; then
              echo "Job submitted successfully! Checking again in 30 seconds..."
            fi
            
            # If the log shows host capacity error, we keep looping
            sleep 30
          done
