name: 24-7 Mumbai VM Grabber
on:
  schedule:
    - cron: '0 */5 * * *' # Restarts every 5 hours
  workflow_dispatch:

jobs:
  loop-request:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI (via Pip)
        run: |
          pip install oci-cli
          echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          echo "region=ap-mumbai-1" >> ~/.oci/config
          echo "key_file=~/.oci/key.pem" >> ~/.oci/config
          
          # Writing the private key secret to a file
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem

      - name: Infinite Loop (30s interval)
        run: |
          # This loop runs for about 5 hours
          end=$((SECONDS+18000))
          while [ $SECONDS -lt $end ]; do
            echo "Attempting to launch at $(date)"
            
            # Using the OCI CLI to trigger your Stack
            RESULT=$(oci resource-manager job create-apply-job \
              --stack-id ${{ secrets.OCI_STACK_OCID }} \
              --execution-plan-strategy AUTO_APPROVED 2>&1)
            
            echo "$RESULT"
            
            # If the job is accepted, it's working!
            if [[ "$RESULT" == *"lifecycle-state\": \"ACCEPTED"* ]] || [[ "$RESULT" == *"lifecycle-state\": \"IN_PROGRESS"* ]]; then
              echo "Job submitted! Checking for capacity again in 30 seconds..."
            fi
            
            # Sleep 30s before trying again
            sleep 30
          done
